<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Tracker</title>
<meta name="description" content="See how much time you actually save by driving faster.">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Road Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
</head>
<body>
<main>
  <header class="head">
    <h1><span class="dot"></span>Road Tracker</h1>
    <button id="gps-btn" class="gps-btn" type="button" aria-pressed="false">Use GPS</button>
  </header>

  <p id="status" class="status" role="status" hidden></p>

  <section class="card">
    <div class="card-head">
      <h2>Speed</h2>
      <span id="live-badge" class="badge" hidden><span class="pulse"></span>Live</span>
    </div>
    <div class="stepper">
      <button type="button" class="step" data-step="-1" aria-label="Slower by 1 mph">&minus;</button>
      <label class="value">
        <input id="speed" type="number" inputmode="numeric" min="1" max="150" step="1" value="65" aria-label="Current speed in mph">
        <span class="unit">mph</span>
      </label>
      <button type="button" class="step" data-step="1" aria-label="Faster by 1 mph">+</button>
    </div>
    <input id="speed-range" class="range" type="range" min="20" max="100" step="1" value="65" aria-label="Speed slider">
  </section>

  <section class="card">
    <div class="card-head"><h2>Distance to go</h2></div>
    <div class="stepper">
      <button type="button" class="step" data-dstep="-10" aria-label="10 miles less">&minus;</button>
      <label class="value">
        <input id="distance" type="number" inputmode="decimal" min="1" max="5000" step="1" value="100" aria-label="Distance in miles">
        <span class="unit">mi</span>
      </label>
      <button type="button" class="step" data-dstep="10" aria-label="10 miles more">+</button>
    </div>
    <div class="chips" id="chips">
      <button type="button" data-dist="25">25</button>
      <button type="button" data-dist="50">50</button>
      <button type="button" data-dist="100">100</button>
      <button type="button" data-dist="250">250</button>
      <button type="button" data-dist="500">500</button>
    </div>
  </section>

  <section class="card baseline">
    <p class="lead"><b id="b-dist">100</b> mi at <b id="b-speed">65</b> mph</p>
    <p class="time" id="b-time">1h 32m</p>
    <p class="eta" id="b-eta"></p>
  </section>

  <section class="card">
    <div class="card-head"><h2>Go faster</h2><span class="hint">time saved</span></div>
    <ol id="rows" class="rows"></ol>
    <p class="foot" id="foot"></p>
  </section>

  <footer class="legal">
    <p>Savings assume you hold the higher speed for the whole distance, with no stops, traffic or slowdowns. Obey posted limits.</p>
  </footer>
</main>

<div id="toast" class="toast" hidden><span>New version available</span><button type="button" id="reload">Reload</button></div>
<script src="/app.js"></script>
</body>
</html>
